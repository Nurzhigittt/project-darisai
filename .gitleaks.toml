title = "DärisAI secret scanning"

[extend]
useDefault = true

[allowlist]
description = "Ignore local build output, dependency trees, virtualenvs, test artifacts and synthetic API fixtures. Axiom fixture tokens are placeholders; no credentials are stored there."
paths = [
  '''node_modules''',
  '''\.next''',
  '''\.venv''',
  '''playwright-report''',
  '''test-results''',
  '''\.pytest_cache''',
  '''\.mypy_cache''',
  '''\.ruff_cache''',
  '''\.hypothesis''',
  '''\.pip-tools-cache''',
  '''docs/contracts/fixtures/axiom''',
]
