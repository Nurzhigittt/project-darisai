name: daris-ai

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: daris
      POSTGRES_USER: daris
      POSTGRES_PASSWORD: daris
    ports:
      - "5433:5432"
    volumes:
      - daris_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daris -d daris"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - daris_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    command: ["python", "-m", "app.migrate"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://daris:daris@db:5432/daris
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://daris:daris@db:5432/daris
      REDIS_URL: redis://redis:6379/0
      APP_BASE_URL: http://localhost:3000
      PUBLIC_WS_URL: ws://localhost:8000/ws
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      WS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      RUN_MIGRATIONS: "false"
      AUTO_SEED: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_GITHUB_URL: ${NEXT_PUBLIC_GITHUB_URL:-https://github.com/Nurzhigittt/project-darisai}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  daris_pgdata:
  daris_redisdata:

