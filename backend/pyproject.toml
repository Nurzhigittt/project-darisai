[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "daris-ai-backend"
version = "0.1.0"
description = "DärisAI API and real-time Signal/Ripple gateway"
requires-python = ">=3.12"
dependencies = [
  "asyncpg==0.32.0",
  "fastapi==0.136.1",
  "huggingface-hub==1.33.0",
  "httpx==0.28.1",
  "numpy==2.5.5",
  "onnxruntime==1.32.0",
  "prometheus-client==0.24.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.13.0",
  "PyJWT==2.10.1",
  "python-multipart==0.0.20",
  "redis==6.4.0",
  "tokenizers==0.23.3",
  "uvicorn[standard]==0.47.0",
]

[project.optional-dependencies]
dev = [
  "hypothesis==6.148.7",
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "ruff==0.14.5",
  "websockets==15.0.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "error::DeprecationWarning:app.*",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = [
  "S101",
  "B008",
  "RUF001",
  "RUF002",
  "RUF003",
  "E501",
  "ASYNC109",
  "UP046",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"app/config.py" = ["S105"]
"app/seed.py" = ["S105"]
"app/schemas/*" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "redis", "redis.*", "prometheus_client", "prometheus_client.*", "onnxruntime", "onnxruntime.*", "tokenizers", "tokenizers.*", "huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true
follow_imports = "skip"
