name: End-to-end

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright Signal to Ripple
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: daris
          POSTGRES_PASSWORD: daris
          POSTGRES_DB: daris
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daris -d daris"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://daris:daris@127.0.0.1:5432/daris
      REDIS_URL: redis://127.0.0.1:6379/0
      E2E_INVITE_CODE: DARIS-TEACH-2026
      PYTHONIOENCODING: utf-8
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Start backend
        working-directory: backend
        env:
          RUN_MIGRATIONS: "true"
          AUTO_SEED: "true"
          SEED_PROFESSOR_INVITE_CODE: DARIS-TEACH-2026
          APP_BASE_URL: http://localhost:3000
          PUBLIC_WS_URL: ws://localhost:8000/ws
          CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
          WS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/daris-api.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready"
          cat /tmp/daris-api.log
          exit 1
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
      - name: Run Playwright
        working-directory: frontend
        run: pnpm e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: API logs on failure
        if: failure()
        run: cat /tmp/daris-api.log
