name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint, types and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: daris
          POSTGRES_PASSWORD: daris
          POSTGRES_DB: daris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daris -d daris_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://daris:daris@127.0.0.1:5432/daris_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        working-directory: backend
        run: ruff check app tests
      - name: Mypy
        working-directory: backend
        run: mypy app
      - name: Unit tests
        working-directory: backend
        run: pytest tests/unit -q
      - name: Integration and security tests
        working-directory: backend
        run: pytest tests/integration tests/security -q

  frontend:
    name: Frontend lint, types, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: ESLint
        working-directory: frontend
        run: pnpm lint
      - name: TypeScript
        working-directory: frontend
        run: pnpm typecheck
      - name: Unit tests
        working-directory: frontend
        run: pnpm test
      - name: Production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: pnpm build

  contracts:
    name: API and WebSocket contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: |
          cd backend && pip install -e ".[dev]"
          cd ../frontend && pnpm install --frozen-lockfile
      - name: Regenerate contracts and TypeScript types
        run: |
          python scripts/export_schemas.py
          cd frontend && pnpm contracts
      - name: Fail on drift
        run: git diff --exit-code -- docs/contracts frontend/src/lib/api/types.gen.ts

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan repository
        run: gitleaks detect --source . --redact --verbose
